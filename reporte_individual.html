<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vicus Inmunización - Reporte y Acta de Desvío</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192x192.png">
  <meta name="theme-color" content="#00384d">
  <link rel="stylesheet" href="./css/pwa-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    /* Estilos base del reporte (Sincronizados con Farmacia) */
    .container {
      background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px; border-left: 5px solid #10b981; margin-bottom: 24px;
    }
    .header-reporte { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn-reporte { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
    .btn-save { background: #10b981; color: white; }
    .btn-desvio { background: #ef4444; color: white; display: flex; align-items: center; gap: 8px; }
    .btn-back { background: #64748b; color: white; }

    /* Estilos del Formulario de Desvío (Modal) */
    .modal-desvio {
      display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); overflow-y: auto;
    }
    .modal-content {
      background: white; margin: 2% auto; width: 95%; max-width: 1000px; border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 0;
    }
    .modal-header { background: #00384d; color: white; padding: 15px 25px; border-radius: 15px 15px 0 0; display: flex; justify-content: space-between; }
    .modal-body { padding: 25px; background: #f8fafc; }
    .form-section { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .form-title { color: #00384d; font-weight: 700; margin-bottom: 15px; border-left: 4px solid #3b82f6; padding-left: 10px; }
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
    
    .table-vacunas { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    .table-vacunas th { background: #f1f5f9; padding: 10px; text-align: left; }
    .table-vacunas td { padding: 8px; border-bottom: 1px solid #e2e8f0; }
    
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>

  <div class="header-reporte no-print">
    <button class="btn-reporte btn-back" onclick="window.history.back()">← Volver</button>
    <h2 id="tituloSensor">Reporte de Sensor</h2>
    <div class="controls">
      <button class="btn-reporte btn-save" onclick="prepararPDF()">💾 Guardar PDF en Drive</button>
      <button class="btn-reporte btn-desvio" onclick="abrirModalDesvio()">⚠️ Reportar Desvío</button>
    </div>
  </div>

  <div id="reporteContenido" class="container">
    <!-- Aquí se genera la gráfica y tablas automáticamente -->
    <canvas id="tempChart"></canvas>
    <div id="eventosLog"></div>
  </div>

  <!-- MODAL: ACTA DE DESVÍO DE CADENA DE FRÍO -->
  <div id="modalDesvio" class="modal-desvio">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ACTA DE DESVÍO DE CADENA DE FRÍO - INMUNIZACIÓN</h3>
        <button onclick="cerrarModalDesvio()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" id="formDesvio">
        
        <div class="form-section">
          <div class="form-title">1. DATOS DEL ESTABLECIMIENTO</div>
          <div class="grid-form">
            <div><label>Establecimiento / Centro</label><input type="text" id="dev_centro" readonly></div>
            <div><label>Fecha del Evento</label><input type="date" id="dev_fecha"></div>
            <div><label>Hora de Detección</label><input type="time" id="dev_hora"></div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-title">2. DATOS DEL EQUIPO Y TEMPERATURAS</div>
          <div class="grid-form">
            <div><label>Equipo (Heladera/Freezer)</label><input type="text" id="dev_equipo"></div>
            <div><label>Temp. Máxima Alcanzada (°C)</label><input type="number" step="0.1" id="dev_tmax"></div>
            <div><label>Tiempo de Exposición (Horas/Min)</label><input type="text" id="dev_tiempo"></div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-title">3. DETALLE DE INSUMOS EXPUESTOS</div>
          <table class="table-vacunas" id="tablaInsumos">
            <thead>
              <tr>
                <th>Vacuna / Insumo</th>
                <th>Lote</th>
                <th>Vencimiento</th>
                <th>Cantidad (Dosis)</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input type="text" placeholder="Ej: Quíntuple"></td>
                <td><input type="text"></td>
                <td><input type="date"></td>
                <td><input type="number"></td>
                <td><button onclick="eliminarFila(this)" style="color:red">✕</button></td>
              </tr>
            </tbody>
          </table>
          <button onclick="agregarFila()" class="btn-reporte" style="margin-top:10px; background:#3b82f6; color:white;">+ Agregar Insumo</button>
        </div>

        <div class="form-section">
          <div class="form-title">4. OBSERVACIONES Y ACCIONES INICIALES</div>
          <textarea id="dev_obs" rows="3" placeholder="Describa brevemente lo ocurrido y las acciones tomadas (ej: traslado a conservadora)..."></textarea>
        </div>

      </div>
      <div class="modal-footer" style="padding: 20px; text-align: right; border-top: 1px solid #eee;">
        <button class="btn-reporte btn-back" onclick="cerrarModalDesvio()">Cancelar</button>
        <button class="btn-reporte btn-save" onclick="generarActaDesvioPDF()">🚀 Generar y Guardar Acta</button>
      </div>
    </div>
  </div>

  <script>
    // Lógica de carga de datos (Sincronizada con el sistema unificado)
    const urlParams = new URLSearchParams(window.location.search);
    const sensorId = urlParams.get('id');
    const sensorKey = urlParams.get('key');
    const sensorName = urlParams.get('name') || 'Sensor';
    const centroName = urlParams.get('centro') || 'Zona 1';
    
    document.getElementById('tituloSensor').innerText = `Monitoreo: ${sensorName} (${centroName})`;
    document.getElementById('dev_centro').value = centroName;
    document.getElementById('dev_equipo').value = sensorName;

    function abrirModalDesvio() { 
        document.getElementById('modalDesvio').style.display = 'block'; 
        // Auto-completar fecha y hora actual
        const ahora = new Date();
        document.getElementById('dev_fecha').value = ahora.toISOString().split('T')[0];
        document.getElementById('dev_hora').value = ahora.toTimeString().slice(0,5);
    }
    function cerrarModalDesvio() { document.getElementById('modalDesvio').style.display = 'none'; }

    function agregarFila() {
        const tbody = document.querySelector('#tablaInsumos tbody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="date"></td>
            <td><input type="number"></td>
            <td><button onclick="eliminarFila(this)" style="color:red">✕</button></td>
        `;
        tbody.appendChild(tr);
    }
    function eliminarFila(btn) { btn.parentElement.parentElement.remove(); }

    // --- LÓGICA DE GENERACIÓN DE PDF ---
    async function generarActaDesvioPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Cabecera Institucional
        doc.setFontSize(18);
        doc.setTextColor(0, 56, 77);
        doc.text("ACTA DE DESVÍO DE CADENA DE FRÍO", 105, 20, { align: 'center' });
        
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text("Programa de Inmunizaciones - Hospital Natalio Burd", 105, 28, { align: 'center' });
        doc.line(20, 32, 190, 32);

        // Datos del Evento
        doc.setFontSize(12);
        doc.setTextColor(0);
        doc.text(`Centro: ${document.getElementById('dev_centro').value}`, 20, 45);
        doc.text(`Fecha: ${document.getElementById('dev_fecha').value}`, 20, 52);
        doc.text(`Hora: ${document.getElementById('dev_hora').value}`, 80, 52);
        doc.text(`Equipo: ${document.getElementById('dev_equipo').value}`, 20, 59);

        // Tabla de Insumos
        const rows = [];
        document.querySelectorAll('#tablaInsumos tbody tr').forEach(tr => {
            const inputs = tr.querySelectorAll('input');
            rows.push([inputs[0].value, inputs[1].value, inputs[2].value, inputs[3].value]);
        });

        doc.autoTable({
            startY: 70,
            head: [['Vacuna/Insumo', 'Lote', 'Vencimiento', 'Dosis']],
            body: rows,
            theme: 'striped',
            headStyles: { fillColor: [0, 56, 77] }
        });

        // Observaciones
        const finalY = doc.lastAutoTable.finalY + 10;
        doc.text("OBSERVACIONES Y ACCIONES:", 20, finalY);
        doc.setFontSize(10);
        const obs = document.getElementById('dev_obs').value || "Sin observaciones adicionales.";
        const splitText = doc.splitTextToSize(obs, 170);
        doc.text(splitText, 20, finalY + 7);

        // Pie de firma
        doc.line(40, 260, 90, 260);
        doc.text("Firma Responsable", 50, 265);
        doc.line(120, 260, 170, 260);
        doc.text("Aclaración", 135, 265);

        // Guardado Automático en Drive
        const pdfBase64 = doc.output('datauristring').split(',')[1];
        const filename = `Acta_Desvio_${centroName.replace(/ /g,'_')}_${document.getElementById('dev_fecha').value}.pdf`;
        
        // Usamos el ID de la carpeta de desvío del centro (esto lo manejamos vía Script)
        alert("Generando Acta y sincronizando con Google Drive...");
        
        const response = await fetch('https://script.google.com/macros/s/AKfycbyj0y92G5aQcpeE3S3wkldzk8sr0hjJXcwCAJl8yQq9oXogUIUHDOszWEEjlmxOWTE/exec', {
            method: 'POST',
            body: JSON.stringify({
                action: 'guardarPDF',
                pdfData: pdfBase64,
                filename: filename,
                folderId: 'BUSCAR_ID_DINAMICO' // El script de Google ya lo sabe por el mapeo
            })
        });

        if(response.ok) {
            alert("¡Acta guardada correctamente en la carpeta de Desvíos!");
            cerrarModalDesvio();
        } else {
            alert("Error al guardar en Drive. Se descargará localmente.");
            doc.save(filename);
        }
    }

    // El resto de la lógica de Chart.js y ThingSpeak iría aquí...
  </script>
</body>
</html>
