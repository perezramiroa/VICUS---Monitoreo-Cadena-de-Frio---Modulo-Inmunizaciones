<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portal de Acceso - Inmunización</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
  <link rel="stylesheet" href="./css/pwa-styles.css">
  <style>
    :root {
      --bg: #0f172a;
      --fg: #f8fafc;
      --primary: #3b82f6;
      --card-bg: #1e293b;
      --border: #334155;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .portal-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .logos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    .logos img {
      max-height: 80px;
      border-radius: 8px;
    }
    h1 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 15px;
      display: none;
    }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="logos">
      <img src="./logos/logo_hnb_oscuro.jpg" alt="Hospital Natalio Burd" onerror="this.style.display='none'">
      <img src="./logos/logo_rih.jpg" alt="RIH" onerror="this.style.display='none'">
    </div>
    <h1>Módulo de Inmunización</h1>
    <p>Ingrese la clave de su establecimiento para acceder al monitoreo de cadena de frío.</p>
    
    <input type="password" id="passInput" placeholder="Clave de acceso..." onkeypress="if(event.key === 'Enter') login()">
    <button onclick="login()">Ingresar</button>
    <div id="errorMsg" class="error-msg">❌ Clave incorrecta o no autorizada.</div>
  </div>

  <div class="footer">
    <img src="./logos/footer.jpg" alt="Gobierno" style="max-width: 300px; width: 100%; border-radius:8px; opacity:0.8;" onerror="this.style.display='none'">
    <p style="margin-top:15px; font-size:0.8rem; opacity:0.7;">Vicus PWA - Sistema Profesional de Trazabilidad</p>
  </div>

  <!-- Configuración Centralizada -->
  <script src="./js/config-sensores.js"></script>
  <script>
    function login() {
      const pass = document.getElementById('passInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      
      if (!pass) return;

      // Buscar si la contraseña ingresada coincide con alguna clave en los accesos
      let canales_autorizados = null;
      let nombre_zona = "General";

      for (const [nombre, canales] of Object.entries(CONFIG_INMUNO.accesos)) {
          if (pass === nombre || pass.toLowerCase() === nombre.toLowerCase()) {
              canales_autorizados = canales;
              nombre_zona = nombre;
              break;
          }
      }

      // Si se encuentra un acceso válido, guardar sesión y redirigir
      if (canales_autorizados) {
          const sesion = {
              nombre: nombre_zona,
              canales: canales_autorizados
          };
          sessionStorage.setItem('vicus_inmuno_config', JSON.stringify(sesion));
          window.location.href = "dashboard_inmunizacion.html";
      } else {
          errorMsg.style.display = 'block';
          document.getElementById('passInput').value = "";
      }
    }
    
    // Auto-login si ya hay sesión
    window.onload = () => {
        if (sessionStorage.getItem('vicus_inmuno_config')) {
            window.location.href = "dashboard_inmunizacion.html";
        }
    }
  </script>
</body>
</html>
